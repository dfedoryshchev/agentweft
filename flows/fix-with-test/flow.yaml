name: fix-with-test
steps:
  - role: worker
    prompt: worker.md
    must_produce: "FAILS:"
    gates:
      - gate: red-test
        red: true
  - role: patcher
    prompt: patcher.md
    on_redo: worker
  - role: verify
    prompt: verify.md
    on_redo: patcher
    gates:
      - gate: regex
        pattern: "^FAIL "
        present: false
promises:
  inputs: a bug report and the file it is probably in
  outputs: a failing test, then a patch, then the test passing
  invariants:
    - the test is written before the patch
    - the test fails on the unpatched code
    - the patch is the smallest thing that turns it green
max_calls: 9
timeout: 300
retries: 2
journal: false
