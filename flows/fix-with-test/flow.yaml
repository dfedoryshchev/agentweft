name: fix-with-test
investigate: off
steps:
  - role: worker
    prompt: worker.md
    writes: tests
    writes_tests: true
    must_produce: "FAILS:"
    gates:
      - gate: red-test
        red: true
        command: ["python", "-m", "pytest", "-q", "{test}"]
  - role: patcher
    prompt: patcher.md
    writes: product
    writes_tests: true
    on_redo: worker
    gates:
      - gate: red-test
        red: false
        command: ["python", "-m", "pytest", "-q", "{test}"]
      - gate: red-first
        command: ["python", "-m", "pytest", "-q", "-p", "no:cacheprovider", "{test}"]
  - role: verify
    prompt: verify.md
    writes: none
    on_redo: patcher
    gates:
      - gate: verdict
        passes: 3
      - gate: command
        command: ["python", "-m", "pytest", "-q"]
        expect: 0
promises:
  inputs: a bug report and the file it is probably in
  outputs: a failing test, then a patch, then the test passing
  invariants:
    - the test is written before the patch
    - the test fails on the unpatched code
    - the patch is the smallest thing that turns it green
max_calls: 9
timeout: 300
retries: 2
