name: weekly digest
steps:
  - role: planner
    prompt: planner.md
  - role: worker
    prompt: worker.md
    fanout: true
  - role: merge
    prompt: merge.md
  - role: reviewer
    prompt: reviewer.md
schedule: sunday
timeout: 300
retries: 3
workers: 4
temperature: 0.1
note: "read on a sunday, not friday: friday me is too tired to decide anything"
