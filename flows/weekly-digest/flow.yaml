name: weekly digest
steps:
  - role: planner
    prompt: planner.md
  - role: worker
    prompt: worker.md
    fanout: true
  - role: merge
    prompt: merge.md
  - role: reviewer
    prompt: reviewer.md
promises:
  inputs: the .md files in the inbox modified in the last 7 days
  outputs: three lists - what changed, needs me, can wait
  invariants:
    - no file appears in two lists
    - needs me is at most 5 lines
    - every line names a file
max_calls: 20
max_tokens: 120000
schedule: sunday
timeout: 420
retries: 3
workers: 4
temperature: 0.1
note: "read on a sunday, not friday: friday me is too tired to decide anything"
