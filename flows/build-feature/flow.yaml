name: build-feature
lead: planner
steps:
  - role: planner
    prompt: planner.md
    writes: none
  - role: tester
    prompt: tester.md
    writes: tests
    writes_tests: true
    must_produce: "FAILS:"
    gates:
      - gate: red-test
        red: true
        command: ["python", "-m", "pytest", "-q", "{test}"]
  - role: worker
    prompt: worker.md
    writes: product
    writes_tests: true
    gates:
      - gate: command
        command: ["python", "-m", "pytest", "-q"]
        expect: 0
        timeout: 300
      - gate: red-first
        command: ["python", "-m", "pytest", "-q", "-p", "no:cacheprovider", "{test}"]
  - role: reviewer
    prompt: reviewer.md
    writes: none
    tools: [read, grep, shell]
    on_redo: worker
promises:
  inputs: a feature to build, and the spec it names
  outputs: failing tests, then the code that turns them green, then the files it changed
  invariants:
    - every line names a file
    - the tests are written before the code, and fail without it
    - the whole suite passes once the code is in
max_calls: 10
timeout: 600
retries: 2
