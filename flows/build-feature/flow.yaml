name: build-feature
retro: true
lead: planner
steps:
  - role: planner
    prompt: planner.md
    writes: none
  - role: tester
    prompt: tester.md
    writes: tests
    must_produce: "FAILS:"
    gates:
      - gate: red-test
        red: true
        command: ["python", "-m", "pytest", "-q", "{test}"]
  - role: worker
    prompt: worker.md
    writes: product
    writes_tests: true
    gates:
      - gate: command
        command: ["python", "-m", "pytest", "-q"]
        expect: 0
        timeout: 300
      - gate: red-first
        command: ["python", "-m", "pytest", "-q", "-p", "no:cacheprovider", "--junitxml={results}", "{test}"]
        results: junit
  - role: reviewer
    prompt: reviewer.md
    writes: none
    tools: [read, grep, shell]
    on_redo: worker
    lens: "the spec and the tests: each thing the spec asks for has code and a test that checks it, and nothing the feature does not need has changed"
  - role: reviewer
    prompt: reviewer-runs.md
    writes: none
    tools: [read, grep, shell]
    on_redo: worker
    lens: "what the tests do not run: the new code run by hand on the boundaries, the bad input and the error paths the tests leave out"
reviewers: 2
promises:
  inputs: a feature to build, and the spec it names
  outputs: failing tests, then the code that turns them green, then the files it changed
  invariants:
    - every line names a file
    - the tests are written before the code, and fail without it
    - the whole suite passes once the code is in
spec_files: additions
max_calls: 12
timeout: 600
retries: 2
