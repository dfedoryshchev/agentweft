task: add(1, 2) returns -1, it should return 3
place: place
provider:
  provider: fake
  replies:
    worker.md:
      - say: |
          FAILS: assert -1 == 3
          TEST: tests/test_add.py
        writes:
          tests/test_add.py: |
            from calc import add


            def test_add():
                assert add(1, 2) == 3
    patcher.md:
      - say: |
          TEST: tests/test_add.py

          calc.py: add and sub share one body now
        writes:
          calc.py: |
            def add(a, b):
                return a + b


            def sub(a, b):
                return a + b
expect:
  invariants: all
  outcome: "stopped: gate failed"
  steps:
    match: strict
    path:
      - worker.md ok -> patcher.md  PASS red-test
      - patcher.md gate failed -> patcher.md  PASS red-test  PASS red-first  FAIL command
      - patcher.md gate failed  PASS red-test  PASS red-first  FAIL command
      - retro.md ok
  calls: 4
