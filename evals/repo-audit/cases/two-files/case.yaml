place: place
provider:
  provider: fake
  replies:
    planner.md:
      - |
        TASK: app.py
        WHY: the entry point
        FILES:
        - app.py

        TASK: config.py
        WHY: reads the settings
        FILES:
        - config.py
    worker.md:
      - |
        app.py parses argv and calls run().
        config.py loads settings.yml and has no defaults.
    merge.md:
      - |
        app.py parses argv and calls run().
        config.py loads settings.yml and has no defaults, which is the risk.
    reviewer.md:
      - |
        VERDICT: ok

        app.py parses argv and calls run().
        config.py loads settings.yml and has no defaults, which is the risk.
expect:
  invariants: all
  outcome: done
  steps:
    match: strict
    path:
      - planner.md ok -> worker.md
      - worker.md ok -> merge.md
      - merge.md ok -> reviewer.md
      - reviewer.md ok
  calls: 5
