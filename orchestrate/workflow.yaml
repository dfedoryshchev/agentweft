# the workflow i run on my own product, brought over as it is.
#
# it is a phase list, a named agent per job, and two places where it stops and
# waits for me. over there it lives as prose that the agents are told to read;
# here it is at least a file that can be parsed. nothing enforces it yet.
#
# what is actually gone: the names. the product, the client, the hostnames, and
# the model names - a tier means something to any provider, "opus" does not.
#
# the opinions are gone too now. the endpoint layer, the mapper, the real
# database behind the integration tests and the coverage number i picked for one
# codebase are out of the prompts. a role is a shape; which layer may hold a
# decision is not part of the shape.
#
# what is still one project's, and i am not going to pretend otherwise: the
# files a role is told to read before it starts. two of them do not exist in
# this repo at all. a role should say what it needs to have read, not where that
# happens to live. that is the next job, not this one.

name: feature development

# who runs the whole thing. not a phase, and not something you launch.
lead: lead

phases:
  - name: research
    agents: [doc-researcher, business-analyst, product-qa]
    produces: a feature doc with requirements and scope boundaries in it
    entry: a request, in the words the person asking used
    exit: nothing in the requirements is still a question waiting on an answer

  - name: planning
    agents:
      - {agent: code-reviewer, personality: refactor-advocate}
      - {agent: code-reviewer, personality: minimalist}
      - architect
    produces: one plan, with the two reviewers' conflicts already resolved
    entry: the feature doc exists and its scope boundary is agreed
    exit: every disagreement between the two reviewers has a ruling
    gate: user

  - name: feature doc
    agents: [product-qa, architect, code-reviewer]
    produces: the same doc, after three roles have been through it
    entry: the plan came back approved from the gate
    exit: each of the three left it changed, or said why it did not

  - name: tests
    agents: [test-qa, product-qa]
    produces: every test the feature needs, all of them failing
    entry: the acceptance section of the doc is final
    exit: every acceptance line has a test, and every new test fails

  - name: implementation
    agents: [developer]
    produces: the whole feature in one pass, not a half of it
    entry: the suite is red, and red for the missing feature
    exit: lint, build and test all pass, and their real output is in the report

  - name: technical review
    agents:
      - requirements-qa
      - {agent: code-reviewer, personality: refactor-advocate}
      - {agent: code-reviewer, personality: minimalist}
      - architect
    produces: a technical report - approved, or a list of fixes
    entry: the suite is green
    exit: the loop closed on approved, or it ran five times and became mine
    loop: 5

  - name: product review
    agents: [e2e-flows, e2e-consistency, product-qa]
    produces: a product report, written against the running app
    entry: the app is running, with whatever setup it needs done
    exit: every journey in the doc walked, each one pass or fail
    # they drive the same browser, so they cannot go at once
    sequential: true

  - name: delivery
    agents: [doc-updater]
    produces: docs brought up to date, and the change committed
    entry: both reviews came back approved
    exit: nothing in the docs still describes the old behaviour
    gate: user
