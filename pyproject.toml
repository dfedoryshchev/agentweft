[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentweft"
version = "0.1.0"
description = "a runner for multi step prompt flows: specs, roles, journals, guardrails"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = ["pyyaml>=6.0.1", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
agentweft = "agentweft.runner.cli:entrypoint"

[tool.setuptools.packages.find]
include = ["agentweft*"]
