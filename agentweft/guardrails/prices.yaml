# what a model charges, in USD per million tokens.
#
# copied from https://platform.claude.com/docs/en/about-claude/pricing on
# 2026-10-12, the claude api's own list prices: no batch discount, no fast
# mode, no US-only inference, no negotiated rate. prices move. when they do,
# edit this file, or keep a prices.yaml of your own in the directory you run
# from (or name one in PRICES) and that one is read instead of this one.
#
# a model that is not in here is reported with no price, never as free. the
# model ids are the ones the api and the claude cli report; `ids` lists the
# other names the same model answers to.
#
# cache_write_5m and cache_write_1h are the two cache lifetimes, priced apart
# because they are billed apart. `over` is a prompt length (input, cache
# reads and writes included) above which a request pays the `above` rates.

source: https://platform.claude.com/docs/en/about-claude/pricing
checked: 2026-10-12
web_search_per_1000: 10

